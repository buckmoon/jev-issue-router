name: Dependency review
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    # This free feature is available after publication. No paid feature is enabled.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes without blocking merges
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          warn-only: true
          comment-summary-in-pr: never
