name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,slack]'
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Installed package smoke test
        working-directory: ${{ runner.temp }}
        run: |
          issue-model --help
          issue-model-slack --help
          issue-model-app --help
          python -c 'import json, os; from issue_router.core import load_catalog; from slack_bolt import App; assert load_catalog() == json.load(open(os.environ["GITHUB_WORKSPACE"] + "/issue_router/catalog.json"))'
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: '"$(go env GOPATH)/bin/actionlint"'
