name: Model catalog watch
on:
  schedule:
    # Four times a day (UTC). Provider model lists are free to read.
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/model-catalog
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Skip while a proposal is waiting for review
        id: open
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != 0 ]; then
            echo "An open catalog proposal exists; review or close it first." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare provider model lists with the catalog
        if: steps.open.outputs.count == '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: issue-model-catalog --write --summary "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/body.md"
      - name: Open a pull request for new models
        if: steps.open.outputs.count == '0'
        run: |
          if git diff --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          python -m unittest discover -s tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -qam "Add newly listed provider models to the catalog (disabled)"
          git push --force origin "$BRANCH"
          printf '\n---\nこのPRはモデル一覧の定期確認で自動作成されました。GITHUB_TOKENで作成したPRにはCIが自動実行されないため、ブランチへpushするかワークフローを手動実行してください。\n' >> "$RUNNER_TEMP/body.md"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "Catalog: newly listed provider models (review before enabling)" \
            --body-file "$RUNNER_TEMP/body.md"
