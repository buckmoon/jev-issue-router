[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-issue-router"
version = "0.1.0"
description = "Jev selects OpenAI, Claude and Grok model/effort pairs for issues"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
slack = ["slack-bolt>=1.20,<2"]
dev = ["build>=1,<2", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/buckmoon/jev-issue-router"
Documentation = "https://github.com/buckmoon/jev-issue-router#readme"

[project.scripts]
issue-model = "issue_router.cli:main"
issue-model-slack = "issue_router.slack:main"
issue-model-app = "issue_router.app:main"

[tool.setuptools.package-data]
issue_router = ["catalog.json"]

[tool.setuptools.packages.find]
include = ["issue_router*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
