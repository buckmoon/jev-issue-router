# Optional. Applying the recommend-model label triggers evaluation AND a bot comment.
# Label events carry no inputs: set the repository variable ISSUE_MODEL_EVALUATOR to clef to use Clef
# (jev when unset), and CLEF_MODEL to clef-flash for faster, cheaper bulk runs.
name: Recommend models on label
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-model-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  recommend:
    if: github.event.label.name == 'recommend-model'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: buckmoon/jev-issue-router@main
        with:
          issue-number: ${{ github.event.issue.number }}
          post-comment: 'true'
          evaluator: ${{ vars.ISSUE_MODEL_EVALUATOR || 'jev' }}
          clef-model: ${{ vars.CLEF_MODEL || 'clef' }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
